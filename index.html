<!DOCTYPE html>
<html>
<head>
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>E-PPAP</title>
   <script src="api.js"></script>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#d8232a;--red2:#b81c22;--ink:#171a20;--bg:#f6f6f6;--card:#fff;--line:#e8e8e8;--tx:#171a20;--mut:#6f7378;--ok:#1b7f4b;--warn:#b7791f;--bad:#d8232a}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{margin:0;font-family:Inter,"Noto Sans Thai","Segoe UI","Helvetica Neue",Arial,Tahoma,sans-serif;font-size:14px;line-height:1.5;color:var(--tx);background:var(--bg)}
h2,h3{font-weight:600;letter-spacing:-.01em}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{background:rgba(255,255,255,.92);-webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);color:var(--ink);padding:10px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
header .brand{display:flex;align-items:center;gap:14px;cursor:pointer}
header .brand img{height:24px;display:block}
header .brand span{font-size:14px;font-weight:500;letter-spacing:.2px;padding-left:14px;border-left:1px solid #d9d9d9;color:var(--ink)}
header .sp{flex:1}
header .who{font-size:12px;color:var(--mut);text-align:right;line-height:1.35}
header button.hb{background:transparent;border:1px solid #d9d9d9;color:var(--ink);border-radius:4px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px;font-weight:500}
header button.hb:hover{background:#f2f2f2}
header button.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:32px;padding:0}
header button.iconbtn svg{width:18px;height:18px}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:40px;background:#fff;color:var(--tx);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);min-width:210px;padding:6px;display:none;z-index:30}
.menu.on{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;padding:9px 10px;border-radius:6px;cursor:pointer;font:inherit;color:var(--tx);text-align:left}
.menu button:hover{background:#f4f4f4}
.menu button span:first-child{display:flex;color:var(--ink)}
main{max-width:1400px;margin:0 auto;padding:24px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:border-color .12s,box-shadow .12s}
.kpi:hover{border-color:#cfcfcf;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.kpi.on{border-color:var(--c,var(--red));box-shadow:0 0 0 1px var(--c,var(--red))}
.kpi .ico{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.kpi .ico svg{width:20px;height:20px}
.kpi b{display:block;font-size:26px;line-height:1.1;font-weight:500;letter-spacing:-.02em}
.kpi span{color:var(--mut);font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
input,select,textarea{font:inherit;border:1px solid #d9d9d9;border-radius:4px;padding:8px 10px;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(23,26,32,.08)}
textarea{width:100%;min-height:60px}
.btn{background:var(--red);color:#fff;border:1px solid var(--red);border-radius:4px;padding:8px 18px;cursor:pointer;font:inherit;font-weight:500;transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:var(--red2);border-color:var(--red2)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid #cfcfcf}
.btn.sec:hover{background:#f4f4f4;border-color:#9a9a9a}
.btn.ok{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ok:hover{background:#000;border-color:#000}
.btn.warn{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.btn.warn:hover{background:#f2f2f2}
.btn.bad{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn.bad:hover{background:#fdeeee}
.btn.sm{padding:3px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th{background:#fff;text-align:left;padding:12px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl td{padding:13px 12px;border-top:1px solid #f0f0f0;vertical-align:top}
.tbl tbody tr:first-child td{border-top:0}
.tbl tr.row{cursor:pointer}.tbl tr.row:hover td{background:#fafafa}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap;letter-spacing:.02em}
.c-REQUESTED{background:#efefef;color:#444}.c-IN_PROGRESS{background:#fff0c9;color:#7a5600}
.c-PENDING_INTERNAL{background:#ffdcd9;color:#a3141b}.c-PENDING_CUSTOMER{background:#171a20;color:#fff}
.c-APPROVED{background:#d9f2e3;color:#14633a}.c-INTERIM{background:#ffe6b3;color:#8a4b00}
.c-REJECTED{background:#d8232a;color:#fff}.c-IMPORTED{background:#e4e4e4;color:#555}
.prog{background:#e4e4e4;border-radius:6px;height:8px;width:90px;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--ok)}
.late{color:var(--red);font-weight:600}.soon{color:var(--warn);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.grid label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.grid input,.grid select{width:100%}
.kv span{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}.kv b{font-weight:500;word-break:break-word}
.muted{color:var(--mut)}.right{text-align:right}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{padding:10px 12px;border-radius:8px;margin-bottom:12px;background:#f4f4f4;border:1px solid #e3e3e3}
.msg.bad{background:#fdeeee;border-color:#f1c4c6;color:#8f1218}.msg.ok{background:#eaf6ef;border-color:#bfe0cc;color:#14633a}
.ov{position:fixed;inset:0;background:rgba(10,10,10,.5);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 10px;z-index:20}
.modal{background:#fff;border-radius:12px;max-width:960px;width:100%;padding:20px}
.modal h3{margin:0 0 12px}
.items td input[type=text]{width:100%}
.hidden{display:none}
.center{max-width:520px;margin:60px auto;text-align:center}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;z-index:50;display:none;max-width:90%}
#toast.err{background:var(--red)}
.pw{position:relative}
.pw input{width:100%;padding-right:40px}
.pw input::-ms-reveal,.pw input::-ms-clear{display:none}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;color:var(--mut);padding:4px;display:flex}
.pw button:hover{color:var(--ink)}
.sumt{display:flex;align-items:center;gap:8px}
.sumt svg{color:var(--red)}
.badge{background:#efefef;color:#444;border-radius:10px;padding:0 8px;font-size:12px;font-weight:600}
.sw{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:400;color:var(--mut);cursor:pointer;user-select:none}
.sw input{display:none}
.sw .sl{width:30px;height:18px;border-radius:9px;background:#d2d2d2;position:relative;transition:background .15s;flex:none}
.sw .sl::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked+.sl{background:var(--red)}
.sw input:checked+.sl::after{transform:translateX(12px)}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start}
.dmain{min-width:0}
.dside{position:sticky;top:76px}
.feed{background:#fff;border:1.5px solid #a8141b;border-radius:12px;padding:14px}
.feedh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;font-size:15px;margin-bottom:10px}
.feedbox{height:calc(100vh - 300px);min-height:320px;overflow:auto;padding:8px;background:#f9f9f9;border:1px solid var(--line);border-radius:8px}
.ev{text-align:center;color:#a3a3a3;font-size:11.5px;line-height:1.4;margin:8px 4px;word-break:break-word}
.ev b{font-weight:600}
.cm{max-width:86%;margin:8px 0;padding:8px 10px;border-radius:10px;background:#fff;border:1.5px solid #a8141b;color:#4a0b0e}
.cm .muted{color:#9a5a5e}
.cm.me{margin-left:auto;background:#a8141b;border-color:#7d0f14;color:#fff}
.cm.me .muted{color:#f3c9cb}
.cmh{font-size:12px;margin-bottom:2px}
.cmt{white-space:pre-wrap;word-break:break-word}
.chatin{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
.chatin textarea{flex:1;min-height:44px}
.steps{display:flex;gap:3px;width:104px}
.steps i{flex:1;height:5px;border-radius:3px;background:#e4e4e4}
.steps i.done{background:#171a20}
.steps i.cur{background:var(--red)}
.steps.ok i.done{background:var(--ok)}
.steps.bad i.cur{background:#8f1218}
.stp{font-size:12px;margin-top:4px;white-space:nowrap}
.stepper{display:flex;margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 8px 14px}
.stepper .st{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;text-align:center;font-size:12px;color:var(--mut)}
.stepper .st::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:#e4e4e4;z-index:0}
.stepper .st:first-child::before{display:none}
.stepper .st.done::before,.stepper .st.cur::before{background:#171a20}
.stepper .dot{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;background:#e4e4e4;color:#777;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.stepper .dot svg{width:15px;height:15px;stroke-width:3}
.stepper .st.done .dot{background:#171a20;color:#fff}
.stepper .st.cur .dot{background:var(--red);color:#fff;box-shadow:0 0 0 4px #f8d4d6}
.stepper .st.cur .lbl{color:var(--tx);font-weight:600}
.stepper.ok .st.done .dot{background:var(--ok)}
.stepper.ok .st.done::before,.stepper.ok .st.cur::before{background:var(--ok)}
.stepper.bad .st.cur .dot{background:#8f1218;box-shadow:0 0 0 4px #efc9cb}
.stepper.warn .st.done .dot{background:#b7791f}
.stepper.warn .st.done::before{background:#b7791f}
.steps.warn i.done{background:#b7791f}
.dmain{container-type:inline-size}
.items-d{table-layout:fixed;width:100%}
.items-d th{white-space:normal;line-height:1.25;overflow-wrap:normal}
.items-d td,.items-d th{overflow-wrap:anywhere}
.items-d select{max-width:100%}
.items-d tr.nr{opacity:.55}
.items-d td.no,.items-d td.rq,.items-d td.st{white-space:nowrap}
.zipb{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.zipb svg{width:16px;height:16px}
@container (max-width:700px){
.items-d,.items-d tbody,.items-d tr,.items-d td{display:block;width:100%}
.items-d colgroup,.items-d thead{display:none}
.items-d tr{padding:10px 12px;border-top:1px solid #f0f0f0}
.items-d tbody tr:first-child{border-top:0}
.items-d td{border:0;padding:2px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.items-d td[data-l]::before{content:attr(data-l);flex:none;max-width:40%;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);padding-top:2px}
.items-d td.no{display:none}
.items-d td.nm{display:block;font-weight:600;padding-bottom:4px}
.items-d td.nm::before{content:attr(data-n) ". "}
.items-d td.fl,.items-d td.rs{display:block}
.fmb{white-space:nowrap}.fmb.nf{color:#8a5a00}.fmb svg{width:13px;height:13px;margin-right:3px;vertical-align:-2px}.modal .fi .fn{font-size:13px}.fi{display:flex;align-items:center;gap:4px;margin-bottom:4px;min-width:0}.fi .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.fi .xb{padding:2px 7px;color:#c0262d}.fbtns{display:flex;gap:4px;flex-wrap:wrap}.nofile{font-size:12px;font-weight:600;margin-bottom:4px;color:#8a5a00}
.items-d td.fl::before,.items-d td.rs::before{display:block;max-width:none;margin-bottom:2px}
.items-d td:empty{display:none}
.items-d tr.nr{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:8px 12px}
.items-d tr.nr td{display:none}
.items-d tr.nr td.nm,.items-d tr.nr td.st{display:block;width:auto;font-weight:400;padding:0}
.items-d tr.nr td.st::before{display:none}
.items-d td.rs select,.items-d td.rs input{width:100%}
}

.dgrid{display:block}
.chathdr{position:relative}
.pinfo{position:relative;min-height:96px}
.chatfab{position:absolute;right:18px;bottom:16px;width:46px;height:46px;border-radius:50%;border:0;background:var(--red);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(216,35,42,.35);transition:transform .15s,box-shadow .15s}
.chatfab:hover{transform:scale(1.08);box-shadow:0 6px 16px rgba(216,35,42,.45)}
.chatfab svg{width:22px;height:22px}
.chatfab .hbadge{background:#171a20}
.hbadge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:600}
.hbadge.z{display:none}
.dside{position:fixed;top:64px;right:24px;width:400px;max-width:calc(100vw - 24px);z-index:60;display:none;filter:drop-shadow(0 12px 28px rgba(0,0,0,.22))}
.dside.on{display:block;animation:popin .2s cubic-bezier(.2,.8,.3,1)}
.feedbox{height:min(520px,calc(100vh - 290px))!important;min-height:260px!important}
.feedh{cursor:grab;user-select:none;touch-action:none}
.feedh.drag{cursor:grabbing}
.feedh .sw,.feedh .xbtn{cursor:pointer}
.xbtn{background:transparent;border:0;cursor:pointer;font-size:20px;line-height:1;color:var(--mut);padding:0 4px}
.xbtn:hover{color:var(--tx)}
@keyframes popin{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}
/* hover lift on cards */
.kpi,.panel{transition:transform .18s ease,box-shadow .18s ease,border-color .15s}
.kpi:hover{transform:translateY(-4px);box-shadow:0 10px 22px rgba(0,0,0,.10)}
.panel:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.07)}
/* animated status stepper */
.stepper .st::before{transform-origin:left center}
.stepper .st.done::before,.stepper .st.cur::before{animation:lineGrow .6s ease both}
.stepper .st.done .dot{animation:dotPop .45s cubic-bezier(.3,1.6,.5,1) both}
.stepper .st.cur .dot{animation:dotPop .45s cubic-bezier(.3,1.6,.5,1) both,pulse 1.8s ease-out .5s infinite}
.stepper .st:nth-child(2) .dot,.stepper .st:nth-child(2)::before{animation-delay:.15s}
.stepper .st:nth-child(3) .dot,.stepper .st:nth-child(3)::before{animation-delay:.3s}
.stepper .st:nth-child(4) .dot,.stepper .st:nth-child(4)::before{animation-delay:.45s}
.stepper .st.cur:nth-child(2) .dot{animation-delay:.15s,.65s}
.stepper .st.cur:nth-child(3) .dot{animation-delay:.3s,.8s}
.stepper .st.cur:nth-child(4) .dot{animation-delay:.45s,.95s}
@keyframes lineGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes dotPop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(216,35,42,.45)}70%{box-shadow:0 0 0 9px rgba(216,35,42,0)}100%{box-shadow:0 0 0 0 rgba(216,35,42,0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:600px){.dside{top:60px;right:8px;left:8px;width:auto}}
@media(max-width:700px){.hide-s{display:none}main{padding:12px}header{padding:10px 12px}.cm{max-width:92%}}

/* ===== glass theme ===== */
:root{
  --red:#e82127;
  --red2:#c4171c;
  --ink:#111318;
  --bg:#eef0f3;
  --card:rgba(255,255,255,.72);
  --line:rgba(255,255,255,.55);
  --tx:#111318;
  --mut:#6b7280;
  --ok:#0f9d58;
  --warn:#c47a00;
  --bad:#e82127;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 4px 24px rgba(15,18,25,.05);
  --shadow-lg:0 12px 40px rgba(15,18,25,.08);
  --glass:saturate(180%) blur(18px);
  --ease:cubic-bezier(.25,.1,.25,1);
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  margin:0;
  font-family:Inter,"Noto Sans Thai","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:14px;font-weight:400;line-height:1.55;color:var(--tx);
  background:
    radial-gradient(1200px 600px at 10% -10%, #f8e8e9 0%, transparent 50%),
    radial-gradient(900px 500px at 90% 0%, #e8eef8 0%, transparent 45%),
    var(--bg);
  letter-spacing:-.011em;
}
h2,h3{font-weight:700;letter-spacing:-.03em;margin:0;color:var(--ink)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Header */
header{
  background:rgba(255,255,255,.55);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
  color:var(--ink);padding:12px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  position:sticky;top:0;z-index:50;
  border-bottom:1px solid rgba(255,255,255,.6);box-shadow:0 1px 0 rgba(0,0,0,.03);
}
header .brand{display:flex;align-items:center;gap:14px;cursor:pointer;user-select:none}
header .brand img{height:24px;width:auto;display:block;transform:translateY(-27%)}
header .brand span{font-size:15px;font-weight:600;letter-spacing:-.02em;padding-left:14px;border-left:1px solid rgba(0,0,0,.1);color:var(--ink)}
header .sp{flex:1}
header .who{font-size:12px;color:var(--mut);text-align:right;line-height:1.4;font-weight:500}
header button.hb{
  background:rgba(255,255,255,.5);border:1px solid rgba(0,0,0,.08);color:var(--ink);
  border-radius:999px;padding:7px 16px;cursor:pointer;font:inherit;font-size:13px;font-weight:500;
  transition:all .18s var(--ease);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
header button.hb:hover{background:rgba(255,255,255,.85);border-color:rgba(0,0,0,.12);box-shadow:var(--shadow)}
header button.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:34px;padding:0}
header button.iconbtn svg{width:18px;height:18px}
.menuwrap{position:relative}
.menu{
  position:absolute;right:0;top:44px;background:rgba(255,255,255,.82);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
  color:var(--tx);border:1px solid rgba(255,255,255,.7);border-radius:14px;
  box-shadow:var(--shadow-lg);min-width:220px;padding:6px;display:none;z-index:60;
}
.menu.on{display:block;animation:fadeUp .18s var(--ease)}
.menu button{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:0;padding:11px 12px;border-radius:10px;cursor:pointer;font:inherit;color:var(--tx);text-align:left;font-weight:500;transition:background .12s}
.menu button:hover{background:rgba(0,0,0,.04)}
.menu button span:first-child{display:flex;color:var(--ink)}

/* Layout */
main{max-width:1280px;margin:0 auto;padding:28px 24px 60px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:14px;margin-bottom:24px}
.kpi{
  background:var(--card);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
  border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;cursor:pointer;
  display:flex;align-items:center;gap:14px;transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .15s;box-shadow:var(--shadow);
}
.kpi:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:rgba(255,255,255,.9)}
.kpi.on{border-color:rgba(232,33,39,.45);box-shadow:0 0 0 1.5px rgba(232,33,39,.25),var(--shadow)}
.kpi .ico{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.kpi .ico svg{width:20px;height:20px;stroke-width:1.75}
.kpi b{display:block;font-size:28px;line-height:1.05;font-weight:700;letter-spacing:-.04em}
.kpi span{color:var(--mut);font-size:12px;font-weight:500;letter-spacing:.01em}

.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
input,select,textarea{
  font:inherit;font-weight:400;border:1px solid rgba(0,0,0,.09);border-radius:var(--radius-sm);
  padding:10px 13px;background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  color:var(--tx);transition:border-color .15s,box-shadow .15s,background .15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:rgba(17,19,24,.35);background:#fff;box-shadow:0 0 0 3px rgba(17,19,24,.06)}
textarea{width:100%;min-height:72px;resize:vertical}

/* Buttons */
.btn{
  background:var(--red);color:#fff;border:1px solid var(--red);border-radius:999px;padding:10px 22px;
  cursor:pointer;font:inherit;font-weight:600;letter-spacing:-.01em;transition:all .18s var(--ease);
  display:inline-flex;align-items:center;gap:7px;box-shadow:0 4px 14px rgba(232,33,39,.22);
}
.btn:hover{background:var(--red2);border-color:var(--red2);transform:translateY(-1px);box-shadow:0 6px 18px rgba(232,33,39,.28)}
.btn:active{transform:translateY(0)}
.btn.sec{background:rgba(255,255,255,.65);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--ink);border:1px solid rgba(0,0,0,.1);box-shadow:none}
.btn.sec:hover{background:rgba(255,255,255,.92);border-color:rgba(0,0,0,.16);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.ok{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 4px 14px rgba(17,19,24,.18)}
.btn.ok:hover{background:#000;border-color:#000}
.btn.warn{background:rgba(255,255,255,.7);color:var(--ink);border:1px solid rgba(0,0,0,.14);box-shadow:none}
.btn.warn:hover{background:#fff}
.btn.bad{background:rgba(255,255,255,.7);color:var(--red);border:1px solid rgba(232,33,39,.35);box-shadow:none}
.btn.bad:hover{background:#fef2f2}
.btn.sm{padding:6px 14px;font-size:12.5px;border-radius:999px;font-weight:600}
.btn:disabled{opacity:.4;cursor:default;transform:none!important;box-shadow:none!important}

/* Table */
.tbl{
  width:100%;border-collapse:collapse;background:var(--card);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
}
.tbl th{background:rgba(255,255,255,.4);text-align:left;padding:14px 16px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);white-space:nowrap;border-bottom:1px solid rgba(0,0,0,.05)}
.tbl td{padding:15px 16px;border-top:1px solid rgba(0,0,0,.04);vertical-align:top;font-weight:400}
.tbl tbody tr:first-child td{border-top:0}
.tbl tr.row{cursor:pointer;transition:background .12s}
.tbl tr.row:hover td{background:rgba(255,255,255,.45)}

/* Chips */
.chip{display:inline-block;padding:4px 12px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;letter-spacing:.02em}
.c-REQUESTED{background:rgba(0,0,0,.06);color:#444}
.c-IN_PROGRESS{background:rgba(196,122,0,.12);color:#8a5600}
.c-PENDING_INTERNAL{background:rgba(232,33,39,.1);color:#b3141b}
.c-PENDING_CUSTOMER{background:#111318;color:#fff}
.c-APPROVED{background:rgba(15,157,88,.12);color:#0a7a44}
.c-INTERIM{background:rgba(196,122,0,.14);color:#8a4b00}
.c-REJECTED{background:var(--red);color:#fff}
.c-IMPORTED{background:rgba(0,0,0,.06);color:#555}

.prog{background:rgba(0,0,0,.06);border-radius:6px;height:5px;width:90px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:6px}
.late{color:var(--red);font-weight:600}.soon{color:var(--warn);font-weight:600}

/* Panels */
.panel{
  background:var(--card);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
  border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:18px;
  box-shadow:var(--shadow);transition:box-shadow .22s var(--ease),transform .22s var(--ease);
}
.panel:hover{box-shadow:var(--shadow-lg)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.grid label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.grid input,.grid select{width:100%}
.kv span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
.kv b{font-weight:500;word-break:break-word;font-size:15.5px;letter-spacing:-.015em}
.muted{color:var(--mut);font-weight:400}.right{text-align:right}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{padding:13px 16px;border-radius:12px;margin-bottom:14px;background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.05);font-weight:500;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.msg.bad{background:rgba(254,240,240,.85);border-color:rgba(232,33,39,.15);color:#8f1218}
.msg.ok{background:rgba(232,248,240,.85);border-color:rgba(15,157,88,.18);color:#0a6b3a}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(12,14,18,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:32px 12px;z-index:80;animation:fadeIn .2s var(--ease)}
.modal{background:rgba(255,255,255,.88);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border:1px solid rgba(255,255,255,.7);border-radius:20px;max-width:960px;width:100%;padding:30px;box-shadow:0 24px 64px rgba(0,0,0,.16);animation:fadeUp .25s var(--ease)}
.modal h3{margin:0 0 16px;font-size:21px;font-weight:700}
.items td input[type=text]{width:100%}
.hidden{display:none}
.center{max-width:480px;margin:80px auto;text-align:center}

/* Toast */
#toast{position:fixed;bottom:28px;right:28px;left:auto;transform:none;background:rgba(17,19,24,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;padding:13px 22px;border-radius:14px;z-index:100;display:none;max-width:360px;font-weight:500;letter-spacing:-.01em;box-shadow:0 12px 32px rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.08);animation:fadeUp .25s var(--ease)}
#toast.err{background:rgba(232,33,39,.94)}

/* Password */
.pw{position:relative}
.pw input{width:100%;padding-right:44px}
.pw input::-ms-reveal,.pw input::-ms-clear{display:none}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;color:var(--mut);padding:6px;display:flex;border-radius:8px}
.pw button:hover{color:var(--ink);background:rgba(0,0,0,.04)}

.sumt{display:flex;align-items:center;gap:8px;font-weight:600}
.sumt svg{color:var(--red)}
.badge{background:rgba(0,0,0,.06);color:#444;border-radius:10px;padding:2px 9px;font-size:12px;font-weight:600}
.sw{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--mut);cursor:pointer;user-select:none}
.sw input{display:none}
.sw .sl{width:34px;height:20px;border-radius:10px;background:rgba(0,0,0,.12);position:relative;transition:background .18s;flex:none}
.sw .sl::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform .18s}
.sw input:checked+.sl{background:var(--red)}
.sw input:checked+.sl::after{transform:translateX(14px)}

/* Detail */
.dgrid{display:block}
.dmain{min-width:0;container-type:inline-size}
.dside{position:fixed;top:72px;right:24px;width:400px;max-width:calc(100vw - 24px);z-index:70;display:none;filter:drop-shadow(0 20px 48px rgba(0,0,0,.14))}
.dside.on{display:block;animation:popin .22s var(--ease)}
.feed{background:rgba(255,255,255,.8);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border:1px solid rgba(232,33,39,.25);border-radius:18px;padding:16px}
.feedh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:15px;margin-bottom:12px;cursor:grab;user-select:none;touch-action:none;letter-spacing:-.02em}
.feedh.drag{cursor:grabbing}
.feedh .sw,.feedh .xbtn{cursor:pointer}
.feedbox{height:min(520px,calc(100vh - 300px))!important;min-height:260px!important;overflow:auto;padding:12px;background:rgba(255,255,255,.4);border:1px solid rgba(0,0,0,.04);border-radius:12px}
.ev{text-align:center;color:#9ca3af;font-size:11.5px;line-height:1.45;margin:10px 4px;word-break:break-word;font-weight:400}
.ev b{font-weight:600;color:#6b7280}
.cm{max-width:86%;margin:10px 0;padding:11px 14px;border-radius:14px;background:rgba(255,255,255,.75);border:1px solid rgba(232,33,39,.18);color:#3a0a0c;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.cm .muted{color:#9a5a5e;font-weight:400}
.cm.me{margin-left:auto;background:linear-gradient(135deg,#e82127,#c4171c);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(232,33,39,.25)}
.cm.me .muted{color:rgba(255,255,255,.7)}
.cmh{font-size:12px;margin-bottom:3px;font-weight:600}
.cmt{white-space:pre-wrap;word-break:break-word;font-weight:400}
.chatin{display:flex;gap:10px;margin-top:12px;align-items:flex-end}
.chatin textarea{flex:1;min-height:48px;border-radius:12px}

/* Stepper */
.steps{display:flex;gap:3px;width:104px}
.steps i{flex:1;height:4px;border-radius:2px;background:rgba(0,0,0,.08)}
.steps i.done{background:#111318}
.steps i.cur{background:var(--red)}
.steps.ok i.done{background:var(--ok)}
.steps.bad i.cur{background:#8f1218}
.stp{font-size:11.5px;margin-top:5px;white-space:nowrap;font-weight:500}
.stepper{display:flex;margin-bottom:20px;background:var(--card);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:var(--radius);padding:22px 12px 18px;box-shadow:var(--shadow)}
.stepper .st{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;text-align:center;font-size:12px;color:var(--mut);font-weight:500}
.stepper .st::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:2px;background:rgba(0,0,0,.08);z-index:0;transform-origin:left center}
.stepper .st:first-child::before{display:none}
.stepper .st.done::before,.stepper .st.cur::before{background:#111318}
.stepper .dot{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.06);color:#777;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.stepper .dot svg{width:15px;height:15px;stroke-width:2.25}
.stepper .st.done .dot{background:#111318;color:#fff}
.stepper .st.cur .dot{background:var(--red);color:#fff;box-shadow:0 0 0 5px rgba(232,33,39,.16)}
.stepper .st.cur .lbl{color:var(--tx);font-weight:700}
.stepper.ok .st.done .dot{background:var(--ok)}
.stepper.ok .st.done::before,.stepper.ok .st.cur::before{background:var(--ok)}
.stepper.bad .st.cur .dot{background:#8f1218;box-shadow:0 0 0 5px rgba(143,18,24,.16)}
.stepper.warn .st.done .dot{background:#b7791f}
.stepper.warn .st.done::before{background:#b7791f}
.steps.warn i.done{background:#b7791f}

/* Items */
.items-d{table-layout:fixed;width:100%}
.items-d th{white-space:normal;line-height:1.3;overflow-wrap:normal;font-weight:600}
.items-d td,.items-d th{overflow-wrap:anywhere}
.items-d select{max-width:100%}
.items-d tr.nr{opacity:.48}
.items-d td.no,.items-d td.rq,.items-d td.st{white-space:nowrap}
.zipb{display:inline-flex;align-items:center;gap:7px;margin-left:auto}
.zipb svg{width:16px;height:16px}

@container (max-width:700px){
  .items-d,.items-d tbody,.items-d tr,.items-d td{display:block;width:100%}
  .items-d colgroup,.items-d thead{display:none}
  .items-d tr{padding:12px 14px;border-top:1px solid rgba(0,0,0,.04)}
  .items-d tbody tr:first-child{border-top:0}
  .items-d td{border:0;padding:3px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .items-d td[data-l]::before{content:attr(data-l);flex:none;max-width:40%;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);padding-top:2px;font-weight:600}
  .items-d td.no{display:none}
  .items-d td.nm{display:block;font-weight:600;padding-bottom:6px}
  .items-d td.nm::before{content:attr(data-n) ". "}
  .items-d td.fl,.items-d td.rs{display:block}
  .items-d td.fl::before,.items-d td.rs::before{display:block;max-width:none;margin-bottom:3px}
  .items-d td:empty{display:none}
  .items-d tr.nr{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 14px}
  .items-d tr.nr td{display:none}
  .items-d tr.nr td.nm,.items-d tr.nr td.st{display:block;width:auto;font-weight:400;padding:0}
  .items-d tr.nr td.st::before{display:none}
  .items-d td.rs select,.items-d td.rs input{width:100%}
}

/* Chat FAB */
.pinfo{position:relative;min-height:100px}
.chatfab{
  position:absolute;right:18px;bottom:16px;width:52px;height:52px;border-radius:18px;border:0;
  background:linear-gradient(145deg,#e82127 0%,#c4171c 100%);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(232,33,39,.32);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease);
}
.chatfab:hover{transform:scale(1.07) translateY(-2px);box-shadow:0 12px 28px rgba(232,33,39,.4)}
.chatfab svg{width:22px;height:22px;stroke-width:1.75}
.chatfab .hbadge{background:#111318}
.hbadge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:700;border:2px solid #fff}
.hbadge.z{display:none}
.xbtn{background:transparent;border:0;cursor:pointer;font-size:22px;line-height:1;color:var(--mut);padding:2px 6px;border-radius:8px;font-weight:300}
.xbtn:hover{color:var(--tx);background:rgba(0,0,0,.05)}

/* Animations */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popin{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes lineGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes dotPop{from{transform:scale(.35);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,33,39,.35)}70%{box-shadow:0 0 0 10px rgba(232,33,39,0)}100%{box-shadow:0 0 0 0 rgba(232,33,39,0)}}
.stepper .st.done::before,.stepper .st.cur::before{animation:lineGrow .55s var(--ease) both}
.stepper .st.done .dot,.stepper .st.cur .dot{animation:dotPop .4s cubic-bezier(.3,1.5,.5,1) both}
.stepper .st.cur .dot{animation:dotPop .4s cubic-bezier(.3,1.5,.5,1) both,pulse 1.8s ease-out .5s infinite}
.stepper .st:nth-child(2) .dot,.stepper .st:nth-child(2)::before{animation-delay:.12s}
.stepper .st:nth-child(3) .dot,.stepper .st:nth-child(3)::before{animation-delay:.24s}
.stepper .st:nth-child(4) .dot,.stepper .st:nth-child(4)::before{animation-delay:.36s}
.stepper .st.cur:nth-child(2) .dot{animation-delay:.12s,.62s}
.stepper .st.cur:nth-child(3) .dot{animation-delay:.24s,.74s}
.stepper .st.cur:nth-child(4) .dot{animation-delay:.36s,.86s}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:600px){
  .dside{top:64px;right:8px;left:8px;width:auto}
  header{padding:10px 14px}
  main{padding:16px 12px 48px}
  .cm{max-width:92%}
  #toast{right:16px;left:16px;bottom:20px}
}
@media(max-width:700px){.hide-s{display:none}}


/* ---- loading feedback ---- */
#topbar{position:fixed;left:0;top:0;height:3px;width:100%;z-index:200;pointer-events:none;opacity:0;transition:opacity .2s;background:linear-gradient(90deg,transparent,var(--red),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:topslide 1.1s ease-in-out infinite}
#topbar.on{opacity:1}
@keyframes topslide{from{background-position:-40% 0}to{background-position:140% 0}}
body.busy{cursor:progress}
.btn.busy{position:relative;color:transparent!important;pointer-events:none}
.btn.busy::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
.btn.sec.busy::after,.btn.warn.busy::after,.btn.bad.busy::after{border-color:rgba(0,0,0,.15);border-top-color:var(--ink)}
@keyframes spin{to{transform:rotate(360deg)}}
.sk{background:linear-gradient(100deg,rgba(255,255,255,.35) 30%,rgba(255,255,255,.85) 50%,rgba(255,255,255,.35) 70%),rgba(0,0,0,.08);background-size:200% 100%;animation:shimmer 1.3s linear infinite;border-radius:12px}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-100% 0}}
.sk-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:14px;margin-bottom:22px}
.sk-row .sk{height:78px}
.sk.l{height:54px;margin-bottom:12px}
.sk.p{height:140px;margin-bottom:16px}
#app>*{animation:fadeUp .3s var(--ease) both}
/* ---- glass refinements (popup must not sit under a CSS filter, or the blur sees nothing) ---- */
.dside{filter:none!important}
.feed{background:rgba(255,255,255,.58);-webkit-backdrop-filter:saturate(190%) blur(22px);backdrop-filter:saturate(190%) blur(22px);border:1px solid rgba(255,255,255,.75);box-shadow:0 24px 60px rgba(15,18,25,.18),inset 0 1px 0 rgba(255,255,255,.8)}
.feedbox{background:rgba(255,255,255,.35)}
.chatfab{background:linear-gradient(145deg,rgba(232,33,39,.9),rgba(196,23,28,.86));border:1px solid rgba(255,255,255,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(232,33,39,.32),inset 0 1px 0 rgba(255,255,255,.55)}
.chatfab svg{width:24px;height:24px}
.panel>.tbl{background:transparent;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:0}
.panel>h3{margin-bottom:14px}
.stepper,.panel,.kpi,.tbl{border-color:rgba(255,255,255,.75);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.7)}

/* ---- chat restyled to the monochrome glass theme ---- */
.chatfab{background:rgba(255,255,255,.62);color:var(--ink);border:1px solid rgba(255,255,255,.9);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);box-shadow:0 8px 24px rgba(15,18,25,.14),inset 0 1px 0 rgba(255,255,255,.9)}
.chatfab:hover{background:rgba(255,255,255,.88);box-shadow:0 12px 30px rgba(15,18,25,.2),inset 0 1px 0 #fff}
.chatfab svg{stroke-width:1.6}
.chatfab .hbadge{background:var(--red);border-color:rgba(255,255,255,.9)}
.feed{border:1px solid rgba(255,255,255,.8)}
.sumt svg{color:var(--ink)}
.feedbox{background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.7)}
.cm{background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.9);color:var(--ink);box-shadow:0 2px 10px rgba(15,18,25,.05)}
.cm .muted{color:var(--mut)}

/* ================= E-PPAP design system v5: one palette, glass surfaces, soft depth ================= */
:root{
  --red:#e5242b; --red2:#c71d24;
  --ink:#0f172a; --tx:#0f172a; --mut:#64748b; --line:rgba(255,255,255,.85);
  --ok:#059669; --warn:#d97706; --bad:#e11d48;
  /* semantic hues: [solid, soft tint, text] */
  --h-all:#475569;   --t-all:rgba(71,85,105,.12);
  --h-pi:#2563eb;    --t-pi:rgba(37,99,235,.12);
  --h-pc:#0891b2;    --t-pc:rgba(8,145,178,.13);
  --h-ok:#059669;    --t-ok:rgba(5,150,105,.13);
  --h-int:#d97706;   --t-int:rgba(217,119,6,.14);
  --h-bad:#e11d48;   --t-bad:rgba(225,29,72,.12);
  --h-late:#ea580c;  --t-late:rgba(234,88,12,.13);
  --glass-bg:linear-gradient(155deg,rgba(255,255,255,.82),rgba(255,255,255,.55));
  --glass-edge:1px solid rgba(255,255,255,.9);
  --sh-1:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(229,36,43,.07);
  --sh-2:0 2px 4px rgba(15,23,42,.04),0 18px 40px rgba(229,36,43,.13);
  --shadow:var(--sh-1); --shadow-lg:var(--sh-2);
}
html body{
  color:var(--ink);
  background:
    radial-gradient(900px 520px at 6% -6%, rgba(229,36,43,.10), transparent 60%),
    radial-gradient(860px 560px at 96% 0%, rgba(229,36,43,.10), transparent 58%),
    radial-gradient(900px 640px at 55% 112%, rgba(8,145,178,.10), transparent 60%),
    #eef1f7!important;
  background-attachment:fixed!important;
}
/* surfaces */
body .kpi, body .panel, body .stepper, body .tbl, body .msg{
  background:var(--glass-bg)!important; border:var(--glass-edge)!important;
  box-shadow:var(--sh-1),inset 0 1px 0 rgba(255,255,255,.95)!important;
}
body .panel>.tbl{background:transparent!important;border:0!important;box-shadow:none!important}
body .kpi:hover{box-shadow:var(--sh-2),inset 0 1px 0 #fff!important;transform:translateY(-4px)}
body .panel:hover{box-shadow:var(--sh-2),inset 0 1px 0 #fff!important}
body .kpi.on{border-color:rgba(229,36,43,.45)!important;box-shadow:0 0 0 2px rgba(229,36,43,.16),var(--sh-2)!important}
body header{background:rgba(255,255,255,.62)!important;border-bottom:1px solid rgba(255,255,255,.9)!important;box-shadow:0 1px 0 rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.04)}
body .tbl th{background:rgba(255,255,255,.5)!important;color:var(--mut);border-bottom:1px solid rgba(15,23,42,.06)}
body .tbl td{border-top:1px solid rgba(15,23,42,.05)}
body .tbl tr.row:hover td{background:rgba(229,36,43,.04)}
/* KPI icons: one style (soft tint tile + coloured line icon) */
body .kpi .ico{width:46px;height:46px;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
body .kpi .ico.t-all{background:var(--t-all);color:var(--h-all);box-shadow:none}
body .kpi .ico.t-pi{background:var(--t-pi);color:var(--h-pi);box-shadow:none}
body .kpi .ico.t-pc{background:var(--t-pc);color:var(--h-pc);box-shadow:none}
body .kpi .ico.t-ok{background:var(--t-ok);color:var(--h-ok);box-shadow:none}
body .kpi .ico.t-int{background:var(--t-int);color:var(--h-int);box-shadow:none}
body .kpi .ico.t-bad{background:var(--t-bad);color:var(--h-bad);box-shadow:none}
body .kpi .ico.t-late{background:var(--t-late);color:var(--h-late);box-shadow:none}
/* status chips use the same hues as the KPI tiles */
body .c-REQUESTED{background:var(--t-all);color:var(--h-all)}
body .c-IN_PROGRESS{background:rgba(100,116,139,.16);color:#334155}

/* buttons */

body .btn.ok{background:linear-gradient(160deg,#10b981,#059669);color:#fff;border:1px solid rgba(255,255,255,.25);box-shadow:0 6px 16px rgba(5,150,105,.25),inset 0 1px 0 rgba(255,255,255,.35)}
body .btn.ok:hover{background:linear-gradient(160deg,#0fae7a,#047857)}
body .btn.warn{color:#b45309;border-color:rgba(217,119,6,.35);background:rgba(255,247,230,.8)}
body .btn.warn:hover{background:#fff3d6}
body .btn.bad{color:#be123c;border-color:rgba(225,29,72,.35);background:rgba(255,238,242,.8)}
body .btn.bad:hover{background:#ffe3ea}
/* inputs */
body input,body select,body textarea{background:rgba(255,255,255,.8);border:1px solid rgba(15,23,42,.1);box-shadow:inset 0 1px 2px rgba(15,23,42,.04)}
body input:focus,body select:focus,body textarea:focus{border-color:rgba(229,36,43,.5);box-shadow:0 0 0 3px rgba(229,36,43,.13);background:#fff}
/* links / states */
body .late{color:var(--h-late)} body .soon{color:var(--warn)}
body .prog i{background:var(--ok)}
body .menu{background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.95);box-shadow:var(--sh-2)}

body header button.hb{background:rgba(255,255,255,.7);border:1px solid rgba(15,23,42,.08)}

/* chat: solid for legibility, brand-red accents */
body .chatfab{background:rgba(255,255,255,.8);color:var(--red);border:1px solid #fff;box-shadow:var(--sh-2),inset 0 1px 0 #fff}
body .feed{box-shadow:0 24px 60px rgba(15,23,42,.18)!important}
/* item table result select tones */

/* ===================================================================
   v11 "Tesla" — quiet, flat, light. White surfaces on #f4f4f4, hairlines,
   thin type, red only as the single accent; motion does the talking.
   =================================================================== */
:root{
  --tz-bg:#f4f4f4; --tz-line:#e6e6e6; --tz-ink:#171a20; --tz-mut:#5c5e62; --tz-red:#e31937;
  --tz-ease:cubic-bezier(.5,0,0,.75); --tz-spring:cubic-bezier(.34,1.56,.64,1);

html body main{max-width:1320px;padding:32px 28px}

html body .kpi, html body .panel, html body .stepper, html body .tbl, html body .msg, html body .pinfo{

  transition:background .3s var(--tz-ease),color .3s var(--tz-ease),transform .4s var(--tz-spring),box-shadow .3s var(--tz-ease)}

function daysLeft(due) {

}

}

const STEP_OF = { REQUESTED: 1, IN_PROGRESS: 1, PENDING_INTERNAL: 2, PENDING_CUSTOMER: 3, REJECTED: 3, INTERIM: 4, APPROVED: 4 };
function stepName(n, st) { return (n === 4 && st === 'INTERIM') ? t('step4i') : t('step' + n); }
function stepTone(st) { return st === 'APPROVED' ? 'ok' : (st === 'INTERIM' ? 'warn' : (st === 'REJECTED' ? 'bad' : '')); }
function stepCls(i, n, tone) { return (i < n || (i === n && (tone === 'ok' || tone === 'warn'))) ? 'done' : (i === n ? 'cur' : ''); }

  return '<div class="steps ' + tone + '" title="' + esc(stepName(n, st)) + '">' + segs + '</div><div class="stp"><b>' + n + '/4</b> <span class="muted">' + esc(stepName(n, st)) + '</span></div>';

function pickPdf(onData, multi) {

    }
    guard(async () => {
      for (let k = 0; k < fs.length; k++) {
        toast(t('uploading') + (fs.length > 1 ? ' (' + (k + 1) + '/' + fs.length + ')' : ''));
        const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(fs[k]); });
        await onData(fs[k].name, b64);

    });
  };
  inp.click();
}

/* ---------------- ZIP of all attached PDFs (built in the browser, no server size limit) ---------------- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function b64ToU8(b64) { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
// "stored" ZIP (no compression: PDFs are already compressed). files = [{name, data: Uint8Array}]
function zipStore(files) {
  const enc = new TextEncoder(), parts = [], central = [];
  const d = new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let offset = 0;
  files.forEach(f => {
    const nameB = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, nameB.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nameB, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, nameB.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), nameB);
    offset += 30 + nameB.length + size;
  });
  const cdSize = central.reduce((n, c) => n + c.length, 0);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true); eo.setUint16(8, files.length, true); eo.setUint16(10, files.length, true);
  eo.setUint32(12, cdSize, true); eo.setUint32(16, offset, true);
  return new Blob(parts.concat(central, [new Uint8Array(eo.buffer)]), { type: 'application/zip' });
}

  S.zipBusy = true;

    const files = [], used = {};
    for (let k = 0; k < jobs.length; k++) {
      toast(t('zip_busy').replace('{a}', k + 1).replace('{b}', jobs.length));
      const f = jobs[k].psw ? await run('apiGetSignedPsw', id) : await run('apiGetFile', id, jobs[k].item, jobs[k].key);
      let name = safeFile(f.name) || ('file' + (k + 1) + '.pdf');
      if (jobs[k].item) name = 'item' + jobs[k].item + '_' + name;
      if (used[name]) name = name.replace(/(\.pdf)?$/i, '_' + (k + 1) + '$1');
      used[name] = 1;
      files.push({ name: name, data: b64ToU8(f.b64) });
    }
    const url = URL.createObjectURL(zipStore(files));
    const a = document.createElement('a');
    a.href = url; a.download = (safeFile(r.PN + '_Rev' + (r.DrawingRev || '') + '_' + r.RequestID) || 'PPAP') + '.zip';

  } catch (e) { toast(errMsg(e), true); }
  S.zipBusy = false;
  const b2 = $('zipBtn'); if (b2) b2.disabled = false;
}

  const H = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  /* profile photo: shown beside the name, edited from the Settings menu */
  const av = document.createElement('div'); av.id = 'mg-av'; $('who').insertAdjacentElement('afterend', av);
  const mb = document.createElement('button'); mb.id = 'mgPhoto'; mb.innerHTML = '<span>' + svg('user') + '</span><span id="mgPhotoT"></span>';
  $('menu').insertBefore(mb, $('mPwI').parentNode);
  const okImg = s => /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(String(s || ''));
  function sync() {
    const me = S.me; mb.style.display = me ? '' : 'none';
    if (!me) { av.classList.remove('show'); return; }
    if (me.avatar === undefined && !me.__ld) { me.__ld = 1; run('apiGetAvatar').then(v => { me.avatar = v || ''; sync(); }).catch(() => { me.avatar = ''; }); }
    const n = String(me.name || '').trim(), p = n.split(/\s+/);
    av.classList.add('show');
    av.innerHTML = okImg(me.avatar) ? '<img alt="" src="' + me.avatar + '">' : H((p.length > 1 ? p[0][0] + p[1][0] : n.charAt(0) || '?').toUpperCase());
    $('mgPhotoT').textContent = L('เปลี่ยนรูปโปรไฟล์', 'Profile photo');
  }
  new MutationObserver(sync).observe($('who'), { childList: true }); sync();
  mb.onclick = () => { $('menu').classList.remove('on'); edit(); };

  const D = 216, CV = 240, OUT = 192; let E = null;
  function draw() {
    const x = E.cv.getContext('2d'); x.fillStyle = '#eceef2'; x.fillRect(0, 0, CV, CV); if (!E.img) return;
    const sc = E.base * E.zoom, w = E.img.naturalWidth * sc, h = E.img.naturalHeight * sc, mx = Math.max(0, (w - D) / 2), my = Math.max(0, (h - D) / 2);
    E.ox = Math.max(-mx, Math.min(mx, E.ox)); E.oy = Math.max(-my, Math.min(my, E.oy));
    x.drawImage(E.img, CV / 2 - w / 2 + E.ox, CV / 2 - h / 2 + E.oy, w, h);
  }
  function load(src, fresh) {
    const im = new Image();
    im.onload = () => { E.img = im; E.base = Math.max(D / im.naturalWidth, D / im.naturalHeight); E.zoom = 1; E.ox = E.oy = 0;
      $('avZ').value = 100; $('avZ').disabled = false; $('avE').style.display = 'none'; if (fresh) $('avS').disabled = false; draw(); };
    im.onerror = () => toast(L('เปิดรูปนี้ไม่ได้', 'Cannot open this image'), true); im.src = src;
  }
  function pick() {
    const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
    i.onchange = () => { const f = i.files && i.files[0]; if (!f) return;
      if (!/^image\//.test(f.type) || f.size > 15728640) { toast(L('เลือกรูปภาพที่ไม่เกิน 15 MB', 'Choose an image under 15 MB'), true); return; } load(URL.createObjectURL(f), true); };
    i.click();
  }
  function edit() {
    if (!S.me) return; const has = okImg(S.me.avatar);
    openModal('<div class="av-ed"><h3 style="margin-bottom:4px">' + L('รูปโปรไฟล์', 'Profile photo') + '</h3><div class="muted">' + L('ลากเพื่อเลื่อนตำแหน่ง ใช้แถบเพื่อซูม', 'Drag to reposition, slide to zoom') + '</div>' +
      '<div class="av-stage" id="avSt"><canvas id="avC" width="' + CV + '" height="' + CV + '"></canvas><div class="rg"></div><div class="av-empty" id="avE"' + (has ? ' style="display:none"' : '') + '>' + L('ยังไม่มีรูป', 'No photo yet') + '</div></div>' +
      '<input type="range" id="avZ" min="100" max="300" value="100" disabled aria-label="Zoom"><div class="av-row"><button class="btn sec" id="avP">' + L('เลือกรูป', 'Choose photo') + '</button>' +
      (has ? '<button class="btn bad" id="avD">' + L('ลบรูป', 'Remove') + '</button>' : '') + '</div><div class="av-row"><button class="btn sec" id="avN">' + L('ยกเลิก', 'Cancel') + '</button><button class="btn" id="avS" disabled>' + L('บันทึก', 'Save') + '</button></div></div>');
    const m = document.querySelector('#ov .modal'); if (m) { m.style.maxWidth = '400px'; m.style.width = '94%'; }
    E = { cv: $('avC'), img: null, base: 1, zoom: 1, ox: 0, oy: 0 }; draw(); if (has) load(S.me.avatar, false);
    $('avP').onclick = pick; $('avN').onclick = closeModal;
    $('avS').onclick = () => { if (!E.img) return;
      const o = document.createElement('canvas'); o.width = o.height = OUT; const x = o.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, OUT, OUT);
      x.drawImage(E.cv, (CV - D) / 2, (CV - D) / 2, D, D, 0, 0, OUT, OUT);
      let q = .86, u = o.toDataURL('image/jpeg', q); while (u.length > 42000 && q > .4) { q -= .1; u = o.toDataURL('image/jpeg', q); }
      guard(async () => { await run('apiSetAvatar', u); S.me.avatar = u; sync(); closeModal(); toast(L('บันทึกรูปแล้ว', 'Photo saved')); }); };
    if ($('avD')) $('avD').onclick = () => { if (confirm(L('ลบรูปโปรไฟล์?', 'Remove your profile photo?'))) guard(async () => { await run('apiSetAvatar', ''); S.me.avatar = ''; sync(); closeModal(); toast(L('ลบรูปแล้ว', 'Photo removed')); }); };
    $('avZ').oninput = e => { E.zoom = e.target.value / 100; $('avS').disabled = false; draw(); };
    const st = $('avSt'); let d = null;
    st.onpointerdown = e => { if (!E.img) { pick(); return; } d = { x: e.clientX, y: e.clientY, ox: E.ox, oy: E.oy }; st.setPointerCapture(e.pointerId); };
    st.onpointermove = e => { if (!d) return; E.ox = d.ox + e.clientX - d.x; E.oy = d.oy + e.clientY - d.y; $('avS').disabled = false; draw(); };
    st.onpointerup = st.onpointercancel = () => { d = null; };
  }
})();
</script>

<script>
/* ---------------- SIR (Sample Inspection Report): QC uploads -> customer is e-mailed -> customer passes / fails ---------------- */
(function () {
  const L = (th, en) => LANG === 'en' ? en : th;
  const $ = id => document.getElementById(id);
  const F = { st: 'ALL', q: '', hist: false };
  const MAP = { PENDING: 'PENDING_CUSTOMER', PASSED: 'APPROVED', FAILED: 'REJECTED', WITHDRAWN: 'REQUESTED' };
  const oc = r => (r.status === 'PENDING' || r.status === 'WITHDRAWN') ? r.status : (r.result || (r.status === 'PASSED' ? 'CONFORMS' : 'NOT_CONFORM'));
  const OCC = { CONFORMS: 'APPROVED', DEVIATIONS: 'IN_PROGRESS', NOT_CONFORM: 'REJECTED' };
  const LBL = () => ({ PENDING: L('รอลูกค้าตอบ', 'Awaiting customer'), PASSED: L('ผ่าน', 'Passed'), FAILED: L('ไม่ผ่าน', 'Failed'), WITHDRAWN: L('ถอนแล้ว', 'Withdrawn') });
  const chipS = s => '<span class="chip c-' + MAP[s] + '">' + esc(LBL()[s] || s) + '</span>';
  const RES = () => ({ CONFORMS: L('ตรงตามแบบ', 'Conforms'), DEVIATIONS: L('ตรงตามแบบ มี deviation', 'Conforms with deviations'), NOT_CONFORM: L('ไม่ตรงตามแบบ', 'Does not conform') });
  const chipR = r => r.result && RES()[r.result] ? '<span class="chip c-' + (OCC[r.result] || MAP[r.status]) + '">' + esc(RES()[r.result]) + '</span>' : chipS(r.status);
  const key = r => (r.pn + '|' + r.rev).toLowerCase();
  const day = s => (s || '').slice(0, 10);
  const D = s => new Date(String(s).replace(' ', 'T'));
  const latestOf = () => { const m = {}; (S.sir || []).forEach(r => { const k = key(r); if (!m[k] || r.round > m[k].round) m[k] = r; }); return m; };

  function visible() {
    const all = S.sir || [], latest = latestOf(), q = F.q.toLowerCase();
    return all.filter(r => (F.hist || latest[key(r)] === r) && (F.st === 'ALL' || oc(r) === F.st || (F.st === 'RESUBMIT' && (r.status === 'FAILED') && latest[key(r)] === r)) &&
      (!q || [r.id, r.pn, r.partName, r.drawingNo, r.rev, r.sirNo, r.lot, r.customerName, r.customer].join(' ').toLowerCase().indexOf(q) >= 0))
      .sort((a, b) => key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : b.round - a.round);
  }
  function stats() {
    const all = S.sir || [], lat = latestOf(), c = { total: all.length, p: 0, ok: 0, dev: 0, bad: 0, re: 0 };
    let sum = 0, n = 0; const first = {};
    all.forEach(r => {
      const o = oc(r); if (o === 'PENDING') c.p++; if (o === 'CONFORMS') c.ok++; if (o === 'DEVIATIONS') c.dev++; if (o === 'NOT_CONFORM') c.bad++; if (r.status === 'FAILED' && lat[key(r)] === r) c.re++;
      if (r.decisionAt && (r.status === 'PASSED' || r.status === 'FAILED')) { sum += (D(r.decisionAt) - D(r.createdAt)) / 86400000; n++; }
      if (r.round === 1 && (r.status === 'PASSED' || r.status === 'FAILED')) first[key(r)] = r.status === 'PASSED' ? 1 : 0;
    });
    const fk = Object.keys(first);
    c.avg = n ? (sum / n).toFixed(1) : '–'; c.fp = fk.length ? Math.round(100 * fk.reduce((a, k) => a + first[k], 0) / fk.length) + '%' : '–';
    return c;
  }

  window.sirHtml = function () {
    const internal = isInternal(), c = stats();
    const kp = (st, label, n, ic, tone) => '<div class="kpi ' + (st && F.st === st ? 'on' : '') + '" title="' + esc(({ DEVIATIONS: 'Conforms with deviations', NOT_CONFORM: 'Does not conform', RESUBMIT: 'Re-submission of this revision required' })[st] || label) + '"' + (st !== null ? ' onclick="sirSt(\'' + st + '\')"' : '') + '><div class="ico t-' + tone + '">' + svg(ic) + '</div><div><b>' + n + '</b><span>' + esc(label) + '</span></div></div>';
    let h = '<div class="greet"><h1>SIR</h1><p>ENS/PPAP sample inspection reports</p></div>';
    h += '<div class="cards sircards">' + kp('ALL', L('SIR ทั้งหมด', 'All SIR'), c.total, 'sir', 'all') + kp('PENDING', L('รอลูกค้าตอบ', 'Awaiting customer'), c.p, 'user', 'pc') +
      kp('CONFORMS', 'Conforms', c.ok, 'check', 'ok') + kp('DEVIATIONS', 'With deviations', c.dev, 'alert', 'int') + kp('NOT_CONFORM', 'Not conform', c.bad, 'xcircle', 'bad') +
      kp('RESUBMIT', L('ต้องส่งซ้ำ', 'Re-submission'), c.re, 'clock', 'late') + '</div>';
    h += '<div class="bar"><span class="sbox"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg><input id="sq" placeholder="' + esc(L('ค้นหา Part / Drawing / SIR / Lot', 'Search part / drawing / SIR / lot')) + '" value="' + esc(F.q) + '" oninput="sirQ(this.value)"></span>' +
      '<label class="sirhist"><input type="checkbox" ' + (F.hist ? 'checked' : '') + ' onchange="sirHist(this.checked)"> ' + L('แสดงประวัติทุกรอบ', 'Show all rounds') + '</label>' +
      (internal ? '<button class="btn" onclick="sirForm()">+ ' + L('อัปโหลด SIR', 'Upload SIR') + '</button>' : '') + '</div>';
    const rows = visible(), latest = latestOf();
    if (!rows.length) return h + '<div class="panel muted center" style="margin:0 auto">' + L('ยังไม่มี SIR', 'No SIR yet') + '</div>';
    h += '<table class="tbl"><thead><tr><th>SIR</th><th>Part Number</th><th class="hide-s">Drawing / Rev</th><th>' + L('รอบ', 'Round') + '</th><th class="hide-s">' + L('ลูกค้า', 'Customer') + '</th><th class="hide-s">' + L('ส่งเมื่อ', 'Sent') + '</th><th>' + L('สถานะ', 'Status') + '</th><th></th></tr></thead><tbody>';
    rows.forEach(r => {
      let act = '';
      if (r.status === 'PENDING' && S.me.role === 'CustomerEng') act += '<button class="btn sm" onclick="sirDecide(\'' + r.id + '\')">' + L('ลงนามอนุมัติ', 'Sign off') + '</button>';
      if (internal && r.status === 'PENDING') act += '<button class="btn sm sec" onclick="sirWithdraw(\'' + r.id + '\')">' + L('ถอน', 'Withdraw') + '</button>';
      if (internal && (r.status === 'FAILED' || r.status === 'WITHDRAWN') && latest[key(r)] === r) act += '<button class="btn sm" onclick="sirForm(\'' + r.id + '\')">' + L('ส่งรอบใหม่', 'Next round') + '</button>';
      h += '<tr class="row" onclick="sirDetail(\'' + r.id + '\')"><td>' + esc(r.id) + '<div class="muted">' + esc(r.sirNo || '') + '</div></td><td>' + esc(r.pn) + '<div class="muted">' + esc(r.partName) + '</div></td>' +
        '<td class="hide-s">' + esc(r.drawingNo) + '<div class="muted">Rev ' + esc(r.rev) + '</div></td><td>' + r.round + '</td><td class="hide-s">' + esc(r.customerName) + '</td>' +
        '<td class="hide-s">' + esc(day(r.createdAt)) + '<div class="muted">' + esc(r.createdBy) + '</div></td><td>' + chipR(r) +
        (r.resubmit === 'YES' ? '<div class="muted">' + L('ส่งใหม่', 'Re-submit') + (r.resubmitQty ? ' · QTY ' + esc(r.resubmitQty) : '') + '</div>' : '') +
        (r.comment ? '<div class="muted sircm" title="' + esc(r.comment) + '">' + esc(r.comment) + '</div>' : '') + '</td><td class="siract" onclick="event.stopPropagation()">' + act + '</td></tr>';
    });
    return h + '</tbody></table>';
  };
  function redraw() { const f = document.activeElement && document.activeElement.id === 'sq'; render(); if (f) { const q = $('sq'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
  window.sirOpen = () => guard(async () => { S.view = 'sir'; S.detail = null; S.sir = await run('apiSirList'); if (isInternal() && !S.sirCust) S.sirCust = await run('apiSirCustomers'); render(); });
  window.sirSt = st => { F.st = F.st === st ? 'ALL' : st; render(); };
  window.sirQ = v => { F.q = v; redraw(); };
  window.sirHist = v => { F.hist = v; render(); };
  window.sirView = (id, w) => openPdf(() => run('apiSirGetFile', id, w));
  window.sirDl = (id, w) => guard(async () => { const f = await run('apiSirGetFile', id, w); const a = document.createElement('a'); a.href = URL.createObjectURL(b64ToBlob(f.b64, f.mime)); a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); });
  window.sirWithdraw = id => { if (!confirm(L('ถอน SIR นี้? (ยังเก็บประวัติไว้)', 'Withdraw this SIR? (it stays in the history)'))) return; guard(async () => { await run('apiSirWithdraw', id); toast(L('ถอนแล้ว', 'Withdrawn')); S.sir = await run('apiSirList'); render(); }); };
  window.sirDecide = id => {
    const r = (S.sir || []).find(x => x.id === id) || {};
    const bx = (name, val, label, on) => '<label class="sgbox"><input type="radio" name="' + name + '" value="' + val + '"' + (on ? ' checked' : '') + '><span class="sgsq"></span><span>' + label + '</span></label>';
    openModal('<div class="sgform"><div class="sghd">Customer Approval / Sign off</div>' +
      '<div class="sgsub">' + esc(r.pn || '') + ' &middot; Rev ' + esc(r.rev || '') + ' &middot; ' + L('รอบ', 'round') + ' ' + esc(r.round || '') + '</div>' +
      '<div class="sgq">' + L('ชิ้นงานผลิตถูกต้องตาม DRG (ระบุ deviation ถ้ามี)', 'Harness has been built correctly to DRG (list deviations if applicable)') + '</div>' +
      '<div class="sgrow">' + bx('sgr', 'CONFORMS', 'Conforms') + bx('sgr', 'DEVIATIONS', 'Conforms with deviations') + bx('sgr', 'NOT_CONFORM', 'Does not Conform') + '</div>' +
      '<div class="sgq">Re-submission of this revision required?</div>' +
      '<div class="sgrow">' + bx('sgs', 'NO', 'No', true) + bx('sgs', 'YES', 'Yes') + '<input id="sgqty" class="sgqty" placeholder="QTY?" disabled></div>' +
      '<div class="sgq">Comments and actions:</div><textarea id="sgcm"></textarea>' +
      '<div class="sgq">' + L('แนบเอกสาร SIR ที่ลงนามแล้ว (PDF) — บังคับ', 'Attach the signed SIR (PDF) as evidence — required') + '</div><input type="file" id="sgFile" accept="application/pdf,.pdf">' +
      '<div class="flex" style="margin-top:12px;justify-content:flex-end"><button class="btn sec" onclick="closeModal()">' + t('cancel') + '</button><button class="btn" id="sgOk">' + L('ยืนยัน', 'Confirm') + '</button></div></div>');
    const ov = $('ov'), val = n => { const e = ov.querySelector('input[name=' + n + ']:checked'); return e ? e.value : ''; };

    });
    ov.querySelectorAll('input[name=sgs]').forEach(e => e.onchange = () => { $('sgqty').disabled = val('sgs') !== 'YES'; if (val('sgs') !== 'YES') $('sgqty').value = ''; });
    $('sgOk').onclick = async () => {
      const res = val('sgr'), rs = val('sgs'), c = $('sgcm').value.trim();
      if (!res) { toast(L('กรุณาเลือกผลการตรวจ', 'Please choose Conforms / Conforms with deviations / Does not Conform'), true); return; }
      if (res !== 'CONFORMS' && !c) { toast(L('กรุณาใส่ Comments and actions', 'Comments and actions are required'), true); return; }
      const f = $('sgFile').files[0];
      if (!f) { toast(L('กรุณาแนบเอกสาร SIR ที่ลงนามแล้ว (PDF)', 'Please attach the signed SIR (PDF)'), true); return; }

      const q = $('sgqty').value;
      $('sgOk').disabled = true;
      let b64; try { b64 = await new Promise((rs2, rj) => { const fr = new FileReader(); fr.onload = () => rs2(String(fr.result).split(',')[1]); fr.onerror = rj; fr.readAsDataURL(f); }); } catch (e) { toast(errMsg(e), true); $('sgOk').disabled = false; return; }
      closeModal();
      guard(async () => { await run('apiSirDecide', id, res, c, rs, q, f.name, b64); toast(L('บันทึกแล้ว', 'Saved')); S.sir = await run('apiSirList'); render(); });
    };
  };

  window.sirDetail = function (id) {
    const r = (S.sir || []).find(x => x.id === id); if (!r) return;
    const internal = isInternal(), latest = latestOf();
    const hist = (S.sir || []).filter(x => key(x) === key(r)).sort((a, b) => b.round - a.round);
    const row = (label, v) => '<div class="kv"><span>' + esc(label) + '</span><b>' + (esc(v) || '-') + '</b></div>';

    if (r.signFile) b += '<button class="btn sm sec" onclick="sirView(\'' + id + '\',\'sign\')">' + L('ใบที่ลงนาม', 'Signed copy') + '</button><button class="btn sm sec" onclick="sirDl(\'' + id + '\',\'sign\')">' + L('โหลดใบที่ลงนาม', 'Download signed') + '</button>';
    if (r.status === 'PENDING' && S.me.role === 'CustomerEng') b += '<button class="btn sm" onclick="sirDecide(\'' + id + '\')">' + L('ลงนามอนุมัติ', 'Sign off') + '</button>';
    if (internal && r.status === 'PENDING') b += '<button class="btn sm sec" onclick="closeModal();sirWithdraw(\'' + id + '\')">' + L('ถอน', 'Withdraw') + '</button>';
    if (internal && (r.status === 'FAILED' || r.status === 'WITHDRAWN') && latest[key(r)] === r) b += '<button class="btn sm" onclick="sirForm(\'' + id + '\')">' + L('ส่งรอบใหม่', 'Next round') + '</button>';
    const dec = r.decisionAt ? row(L('ลูกค้าลงนามโดย', 'Signed off by'), r.decisionBy) + row(L('ลงนามเมื่อ', 'Signed off on'), day(r.decisionAt)) : '';
    const hh = hist.length > 1 ? '<div class="sgq">' + L('ประวัติทุกรอบ (Rev นี้)', 'All rounds (this revision)') + '</div><div class="sdh">' + hist.map(x =>
      '<div class="sdr' + (x.id === id ? ' cur' : '') + '" onclick="sirDetail(\'' + x.id + '\')"><b>R' + x.round + '</b><span>' + esc(x.id) + '</span><span>' + esc(day(x.createdAt)) + '</span>' + chipR(x) + '</div>').join('') + '</div>' : '';
    openModal('<div class="sirdet"><div class="sdhd"><div><div class="sdt">' + esc(r.id) + '</div><div class="muted">' + esc(r.pn) + ' · Rev ' + esc(r.rev) + ' · ' + L('รอบ', 'round') + ' ' + r.round + '</div></div><div>' + chipR(r) + '</div></div>' +
      '<div class="grid sdg">' + row('Part Number', r.pn) + row(L('ชื่อชิ้นงาน', 'Part name'), r.partName) + row('Drawing No.', r.drawingNo) + row('Drawing Rev', r.rev) +
      row('SIR No.', r.sirNo) + row('Lot / WO', r.lot) + row(L('ลูกค้า', 'Customer'), r.customerName || r.customer) + row(L('ส่งเมื่อ', 'Sent on'), day(r.createdAt)) +
      row(L('ส่งโดย', 'Sent by'), r.createdBy) + row('Prepared by', r.preparedBy) + row('Verified by', r.verifiedBy) + dec + '</div>' +
      (r.note ? '<div class="sgq">' + L('หมายเหตุจาก QC', 'Note from QC') + '</div><div class="sdn">' + esc(r.note) + '</div>' : '') +
      (r.result ? '<div class="sgq">Customer Approval / Sign off</div><div class="sgrow sdres"><span><b>' + esc(({ CONFORMS: 'Conforms', DEVIATIONS: 'Conforms with deviations', NOT_CONFORM: 'Does not Conform' })[r.result] || r.result) + '</b></span><span>Re-submission: <b>' + (r.resubmit === 'YES' ? 'Yes' + (r.resubmitQty ? ' · QTY ' + esc(r.resubmitQty) : '') : 'No') + '</b></span></div>' : '') +
      (r.comment ? '<div class="sgq">Comments and actions</div><div class="sdn">' + esc(r.comment) + '</div>' : '') + hh +
      '<div class="sdact">' + b + '<span class="sp"></span><button class="btn sec" onclick="closeModal()">' + L('ปิด', 'Close') + '</button></div></div>');
  };
  window.sirForm = function (fromId) {
    const src = fromId ? (S.sir || []).filter(r => r.id === fromId)[0] : null;
    const v = k => src ? esc(src[k] || '') : '';
    const pns = [...new Set((S.sir || []).map(r => r.pn))];
    const inp = (id, lab, val, extra) => '<div><label class="muted">' + lab + '</label><input id="' + id + '" value="' + (val || '') + '" ' + (extra || '') + '></div>';
    openModal('<h3 style="margin:0 0 10px">' + L('อัปโหลด SIR', 'Upload SIR') + (src ? ' · ' + L('รอบถัดไป', 'next round') : '') + '</h3>' +
      '<div class="sirg">' + inp('sPn', 'Part Number *', v('pn'), 'list="sPnL" autocomplete="off"') + '<datalist id="sPnL">' + pns.map(p => '<option value="' + esc(p) + '">').join('') + '</datalist>' +
      inp('sPName', L('ชื่อชิ้นงาน', 'Part name'), v('partName')) + inp('sDwg', 'Drawing number', v('drawingNo')) + inp('sRev', 'Drawing Rev * (1, 2, 3 … A)', v('rev')) +
      inp('sNo', L('เลข SIR (ถ้ามี)', 'SIR no. (optional)'), '') + inp('sLot', 'Lot / Batch', '') +
      inp('sCust', L('อีเมลลูกค้า *', 'Customer e-mail *'), v('customer'), 'list="sCL" autocomplete="off"') + '<datalist id="sCL">' + (S.sirCust || []).map(c => '<option value="' + esc(c.email) + '">' + esc(c.name) + '</option>').join('') + '</datalist>' +
      inp('sPrep', 'Prepared by', esc(S.me.name)) + inp('sVer', 'Verified by', '') + '</div>' +
      '<label class="muted">' + L('หมายเหตุถึงลูกค้า', 'Note to the customer') + '</label><textarea id="sNote" style="width:100%;min-height:60px"></textarea>' +
      '<label class="muted">PDF *</label><input id="sFile" type="file" accept="application/pdf,.pdf" style="width:100%">' +
      '<div class="flex" style="margin-top:12px;justify-content:flex-end"><button class="btn sec" onclick="closeModal()">' + t('cancel') + '</button><button class="btn" id="sGo" onclick="sirSend()">' + L('อัปโหลดและส่งอีเมลหาลูกค้า', 'Upload and e-mail the customer') + '</button></div>');
    const mm = document.querySelector('#ov .modal'); if (mm) { mm.style.maxWidth = '640px'; mm.style.width = '94%'; }
    $('sPn').addEventListener('change', () => {   // fill the rest from the latest SIR of that part
      const x = (S.sir || []).filter(r => r.pn.toLowerCase() === $('sPn').value.trim().toLowerCase()).sort((a, b) => b.createdAt < a.createdAt ? -1 : 1)[0];
      if (x) { if (!$('sPName').value) $('sPName').value = x.partName; if (!$('sDwg').value) $('sDwg').value = x.drawingNo; if (!$('sCust').value) $('sCust').value = x.customer; }
    });
  };
  window.sirSend = async function () {
    const f = $('sFile').files[0], g = id => $(id).value.trim();
    if (!g('sPn') || !g('sRev') || !g('sCust')) { toast(L('กรอก Part Number, Rev และอีเมลลูกค้า', 'Part Number, Rev and customer e-mail are required'), true); return; }
    if (!f) { toast(L('เลือกไฟล์ PDF', 'Choose a PDF'), true); return; }
    if (!/\.pdf$/i.test(f.name) || f.size > 20 * 1024 * 1024) { toast(L('ต้องเป็น PDF ไม่เกิน 20 MB', 'PDF only, max 20 MB'), true); return; }
    $('sGo').disabled = true;
    try {
      const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(f); });
      const r = await run('apiSirUpload', { pn: g('sPn'), partName: g('sPName'), drawingNo: g('sDwg'), rev: g('sRev'), sirNo: g('sNo'), lot: g('sLot'), customer: g('sCust'), preparedBy: g('sPrep'), verifiedBy: g('sVer'), note: g('sNote'), fileName: f.name, b64 });
      closeModal(); toast(r.registered ? L('ส่ง SIR และอีเมลแล้ว', 'SIR uploaded and e-mailed') : L('ส่งอีเมลแล้ว แต่ลูกค้ายังไม่มีบัญชีในระบบ', 'E-mailed, but this customer has no account yet'));
      S.sir = await run('apiSirList'); render();
    } catch (e) { toast(errMsg(e), true); $('sGo').disabled = false; }
  };

  /* PPAP item 3 "Customer Engineering Approvals": reuse an approved SIR */
  window.sirOffer = async function (rid, itemNo) {
    try {
      const l = (await run('apiSirForRequest', rid)).filter(r => !r.attached);
      const box = $('sirUse'); if (!box || !l.length) return;
      box.innerHTML = '<div class="muted" style="margin-top:12px">' + L('SIR ที่ลูกค้าอนุมัติแล้วของ Part นี้', 'Approved SIRs for this part') + '</div>' +
        l.map(r => '<div class="fi"><span class="fn">' + esc(r.pn) + ' · Rev ' + esc(r.rev) + ' · R' + r.round + '</span><span class="fa"><button class="btn sm" onclick="sirUse(\'' + esc(rid) + '\',\'' + r.id + '\',' + itemNo + ')">' + L('ใช้ไฟล์นี้', 'Use this file') + '</button></span></div>').join('');
    } catch (e) { /* offer is optional */ }
  };
  window.sirUse = (rid, sid, itemNo) => guard(async () => { await run('apiSirAttach', rid, sid); toast(L('แนบ SIR แล้ว', 'SIR attached')); await reloadDetail(rid); fileModal(rid, itemNo); });
})();
</script>
<script>
/* ===== Motion v2 — one calm system for PPAP, SIR, KPI: stagger rise · count-up · cursor glare · sliding nav pill · spring press ===== */
(function () {
  const app = document.getElementById('app'); if (!app) return;
  const RM = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;
  const BLOCKS = '.greet,.dh,.cards>*,.dash .dk,.dash .dc,.dsec,.stepper,.pinfo,.panel,.tbl,.bar,.msg';
  let lastKey = '', tEnd;
  function countUp(el) {
    if (RM || el.hasAttribute('data-cu')) return;
    const tn = [].find.call(el.childNodes, n => n.nodeType === 3 && /\d/.test(n.nodeValue)); if (!tn) return;
    const raw = tn.nodeValue.trim(), end = parseFloat(raw); if (isNaN(end) || end <= 0) return;
    const dec = (raw.split('.')[1] || '').length, t = performance.now(), dur = 1000;
    (function step(now) {
      const p = Math.min(1, (now - t) / dur), e = 1 - Math.pow(1 - p, 4);
      tn.nodeValue = (end * e).toFixed(dec); if (p < 1) requestAnimationFrame(step); else tn.nodeValue = raw;
    })(t);
  }
  function viewKey() {
    return (typeof S !== 'undefined' && S.me) ? (S.view + (S.mode === 'kpi' ? 'K' : '') + ':' + (S.detail && S.view === 'detail' && S.detail.request ? S.detail.request.RequestID : '')) : 'login';
  }
  new MutationObserver(function () {
    const key = viewKey(); if (key === lastKey) return; lastKey = key;
    let i = 0;
    app.querySelectorAll(BLOCKS).forEach(function (el) { el.style.setProperty('--d', Math.min(i++ * 55, 620) + 'ms'); });
    app.querySelectorAll('.items-d tbody tr').forEach(function (tr, k) { tr.style.setProperty('--i', k); });
    app.classList.remove('fx-in'); void app.offsetWidth; app.classList.add('fx-in');
    app.querySelectorAll('.kpi b,.dash .dk b').forEach(countUp);
    clearTimeout(tEnd); tEnd = setTimeout(function () { app.classList.remove('fx-in'); }, 2400);
  }).observe(app, { childList: true });

  // soft glare that follows the pointer on cards
  document.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'touch' || RM) return;
    const c = e.target.closest && e.target.closest('.kpi,.dash .dk,.dash .dc'); if (!c) return;
    const r = c.getBoundingClientRect();
    c.style.setProperty('--mx', (e.clientX - r.left) + 'px'); c.style.setProperty('--my', (e.clientY - r.top) + 'px');
  }, { passive: true });

  // header: soft shadow once the page scrolls
  const hd = document.querySelector('header');
  function sc() { if (hd) hd.classList.toggle('scrolled', window.scrollY > 6); }
  window.addEventListener('scroll', sc, { passive: true }); sc();

  // sliding black pill behind the active header button (spring)
  const mw = document.getElementById('menuWrap');
  if (mw) {
    const pill = document.createElement('i'); pill.id = 'navPill'; mw.insertBefore(pill, mw.firstChild);
    let first = true;
    function place() {
      const on = mw.querySelector('button.hb.on');
      if (!on || !on.offsetWidth) { pill.style.opacity = 0; return; }
      pill.style.opacity = 1;
      pill.style.width = on.offsetWidth + 'px'; pill.style.height = on.offsetHeight + 'px';
      if (first) { pill.style.transition = 'none'; }
      pill.style.transform = 'translate(' + on.offsetLeft + 'px,' + on.offsetTop + 'px)';
      if (first) { void pill.offsetWidth; pill.style.transition = ''; first = false; }
    }
    new MutationObserver(place).observe(mw, { attributes: true, subtree: true, attributeFilter: ['class', 'style'] });
    new MutationObserver(place).observe(app, { childList: true });
    window.addEventListener('resize', place); setTimeout(place, 200); setTimeout(place, 900);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
  }
  // menu items: stagger index
  const m = document.getElementById('menu'); if (m) [].forEach.call(m.children, function (b, i) { b.style.setProperty('--i', i); });
})();
</script>
